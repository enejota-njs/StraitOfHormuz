version: "3.8"

services:
  sector1:
    build:
      context: .
      dockerfile: ./sector/Dockerfile
    command: ["./sector_bin", "1"]
    volumes:
      - ./data:/app/data

  sector2:
    build:
      context: .
      dockerfile: ./sector/Dockerfile
    command: ["./sector_bin", "2"]
    volumes:
      - ./data:/app/data

  sector3:
    build:
      context: .
      dockerfile: ./sector/Dockerfile
    command: ["./sector_bin", "3"]
    volumes:
      - ./data:/app/data

  sector4:
    build:
      context: .
      dockerfile: ./sector/Dockerfile
    command: ["./sector_bin", "4"]
    volumes:
      - ./data:/app/data

  drone1:
    build:
      context: .
      dockerfile: ./drone/Dockerfile
    command: ["./drone_bin", "1"]
    volumes:
      - ./data:/app/data

  drone2:
    build:
      context: .
      dockerfile: ./drone/Dockerfile
    command: ["./drone_bin", "2"]
    volumes:
      - ./data:/app/data

  sensor1:
    build:
      context: .
      dockerfile: ./sensor/Dockerfile
    command: ["./sensor_bin", "1"]
    volumes:
      - ./data:/app/data
  
  sensor2:
    build:
      context: .
      dockerfile: ./sensor/Dockerfile
    command: ["./sensor_bin", "2"]
    volumes:
      - ./data:/app/data

  sensor3:
    build:
      context: .
      dockerfile: ./sensor/Dockerfile
    command: ["./sensor_bin", "3"]
    volumes:
      - ./data:/app/data
  
  sensor4:
    build:
      context: .
      dockerfile: ./sensor/Dockerfile
    command: ["./sensor_bin", "4"]
    volumes:
      - ./data:/app/data

  interface-server:
    build:
      context: .
      dockerfile: ./interface/Dockerfile.go
    command: ["./interface_bin"]
    volumes:
      - ./data:/app/data

  interface-gui:
    build:
      context: .
      dockerfile: ./interface/Dockerfile.py
    command: ["python3", "interface.py"]
    environment:
      - DISPLAY=${DISPLAY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./data:/app/data
